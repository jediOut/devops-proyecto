name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint y Tests Unitarios
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache de dependencias pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
    

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Linting con flake8
        run: flake8 . --max-line-length=100 --exclude=.git,__pycache__

      - name: Tests con coverage
        run: pytest tests/ -v --tb=short --junitxml=test-results/results.xml
      - name: Publicar resultados de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
           name: test-results-${{ github.run_number }}
           path: test-results/
           retention-days: 30

      - name: Build imagen Docker
        run: docker build -t devops-app:${{ github.sha }} .

      - name: Escaneo de seguridad con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Publicar imagen (solo en push a main)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag devops-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}


