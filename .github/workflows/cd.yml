name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types: [completed]

jobs:
  deploy-production:
    name: Deploy → Production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Simular deploy en Producción
        run: |
          echo "========================================="
          echo "  DEPLOY A PRODUCCIÓN"
          echo "  Versión: ${{ github.event.workflow_run.head_sha }}"
          echo "  Ambiente: ${{ vars.APP_ENV }}"
          echo "  Réplicas: ${{ vars.REPLICA_COUNT }}"
          echo "========================================="
          echo "Deploy completado exitosamente en producción"
