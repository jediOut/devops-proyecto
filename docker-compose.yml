version: '3.9'

services:
  app:
    build: .
    container_name: devops-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app                  # Hot reload en desarrollo
    command: pytest tests/ -v --tb=short
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: devops-db
    environment:
      - POSTGRES_USER=devops
      - POSTGRES_PASSWORD=devops123
      - POSTGRES_DB=devopsdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
